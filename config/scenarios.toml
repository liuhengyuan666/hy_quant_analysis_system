# RV1 Phase 2: Strategy scenario configuration.
#
# Scenarios are consumption-layer preference weightings ONLY.
# They never enter final_score / signal_label / portfolio-decision computation paths.
# Each scenario selects a subset of the four existing strategies and re-weights them.
# Weights do not need to sum to 1.0 — scores are normalized at consumption time.

[scenarios.momentum_short]
label = "短线动量博弈"
description = "关注短期动能、突破点、量价配合。适合快进快出的右侧交易视角。"
weights = { MomentumRight = 0.50, TrendBreakout = 0.30, TrendPullback = 0.20 }

[scenarios.value_long]
label = "长线价值配置"
description = "关注估值水位、趋势结构、宏观环境。适合长线布局的左侧与回调视角。"
weights = { ValueLeft = 0.40, TrendPullback = 0.35, TrendBreakout = 0.25 }

[scenarios.aggressive]
label = "激进博弈"
description = "纯动量驱动，不看估值。适合强趋势行情的追涨视角。"
weights = { MomentumRight = 0.70, TrendBreakout = 0.30 }

[scenarios.balanced]
label = "均衡观察"
description = "四类策略等权重，作为无偏好基线参照。"
weights = { ValueLeft = 0.25, TrendPullback = 0.25, TrendBreakout = 0.25, MomentumRight = 0.25 }
