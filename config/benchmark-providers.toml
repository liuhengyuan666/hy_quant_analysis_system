# Benchmark Provider Configuration
# Usage: cargo run -p quant-cli -- benchmark-skill --skill market-regime-reasoning --provider-config config/benchmark-providers.toml

[[provider]]
name = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key = "${DEEPSEEK_API_KEY}"

