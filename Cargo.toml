[workspace]
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/app-service",
  "crates/backtest-engine",
  "crates/core-domain",
  "crates/data-ingestion",
  "crates/indicator-engine",
  "crates/macro-engine",
  "crates/execution-engine",
  "crates/gt-regime-generator",
  "crates/market-state-extractor",
  "crates/regime-audit",
  "crates/market-store",
  "crates/report-engine",
  "crates/research-benchmark",
  "crates/llm-context",
  "crates/research-context",
  "crates/report-renderer",
  "crates/research-skills",
  "crates/rotation-engine",
  "crates/signal-engine",
  "crates/strategy-engine",
  "crates/task-runner",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["OpenCode"]

[workspace.dependencies]
anyhow = "1"
async-openai = { version = "0.34", default-features = false, features = ["chat-completion", "native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clickhouse = { version = "0.13", default-features = false }
attohttpc = { version = "0.28", default-features = false, features = ["tls-native", "json"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
rayon = "1.10"
ureq = { version = "2.10", features = ["native-tls"] }
